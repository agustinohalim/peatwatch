<script>
const chips=[...document.querySelectorAll('.chip')];
function paint(){chips.forEach(c=>{const on=c.getAttribute('aria-pressed')==='true';
c.style.background=on?'#12201C':'#FFFFFF';c.style.color=on?'#FFFFFF':'#12201C';c.style.border='1px solid '+(on?'#12201C':'#D3DAD6');
const g=document.querySelector('[data-g="'+c.dataset.layer+'"]');if(g)g.style.opacity=on?1:0;});}
chips.forEach(c=>c.addEventListener('click',()=>{c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')==='true'?'false':'true');paint();}));
paint();
</script>
