<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Filter Peta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E4D3F}a:hover{color:#0A372D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #DDE8D6; color: #12201C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <svg width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Peta kawasan gambut dengan zona risiko kebakaran, kanal, titik api, dan sensor" style="position: absolute; inset: 0">
    <rect width="390" height="844" fill="#DDE8D6"></rect>
    <path d="M0 90 C80 70 140 110 210 80 S330 60 390 90 L390 0 L0 0 Z" fill="#D3E0CB"></path>
    <path d="M0 700 C90 680 160 720 250 690 S350 670 390 700 L390 844 L0 844 Z" fill="#D3E0CB"></path>
    <path d="M420 120 C330 170 300 140 250 200 C190 270 120 240 80 330 C40 420 60 520 -20 600" fill="none" stroke="#A9CFEA" stroke-width="22" stroke-linecap="round"></path>
    <path d="M420 120 C330 170 300 140 250 200 C190 270 120 240 80 330 C40 420 60 520 -20 600" fill="none" stroke="#8CBFE3" stroke-width="2" stroke-dasharray="6 8"></path>
    <path d="M-10 470 L390 380" stroke="#FFFFFF" stroke-width="5" fill="none"></path>
    <path d="M-10 470 L390 380" stroke="#E3E0D6" stroke-width="1.5" fill="none"></path>

    <g opacity="1" stroke="#4E91C6" stroke-width="2" fill="none">
      <path d="M140 240 L240 720"></path>
      <path d="M210 210 L310 690"></path>
      <path d="M280 180 L380 660"></path>
      <path d="M120 420 L390 360"></path>
      <path d="M150 560 L390 506"></path>
      <path d="M100 300 L280 262"></path>
    </g>

    <g opacity="1">
      <path d="M0 150 L150 128 L140 300 L60 330 L0 340 Z" fill="#E0A800" fill-opacity="0.28" stroke="#C99700" stroke-width="1.5"></path>
      <path d="M0 340 L60 330 L110 470 L40 560 L0 560 Z" fill="#2F9E44" fill-opacity="0.22" stroke="#2F9E44" stroke-width="1.5"></path>
      <path d="M150 128 L330 118 L390 150 L390 520 L250 560 L170 520 L110 470 L60 330 L140 300 Z" fill="#E8590C" fill-opacity="0.24" stroke="#E8590C" stroke-width="1.5"></path>
      <path d="M200 300 L320 280 L360 400 L280 470 L210 440 L180 370 Z" fill="#C92A2A" fill-opacity="0.38" stroke="#C92A2A" stroke-width="2"></path>
      <path d="M200 300 L320 280 L360 400 L280 470 L210 440 L180 370 Z" fill="none" stroke="#12201C" stroke-width="2.5" stroke-dasharray="8 6"></path>
      <path d="M40 560 L170 520 L250 560 L230 660 L60 680 L0 640 L0 560 Z" fill="#E0A800" fill-opacity="0.24" stroke="#C99700" stroke-width="1.5"></path>
    </g>

    <g opacity="0">
      <rect x="140" y="320" width="16" height="16" rx="5" fill="#1971C2" stroke="#FFFFFF" stroke-width="2.5"></rect>
      <rect x="92" y="200" width="16" height="16" rx="5" fill="#1971C2" stroke="#FFFFFF" stroke-width="2.5"></rect>
      <rect x="320" y="470" width="16" height="16" rx="5" fill="#1971C2" stroke="#FFFFFF" stroke-width="2.5"></rect>
      <rect x="250" y="226" width="16" height="16" rx="5" fill="#1971C2" stroke="#FFFFFF" stroke-width="2.5"></rect>
      <rect x="264" y="400" width="16" height="16" rx="5" fill="#1971C2" stroke="#FFFFFF" stroke-width="2.5"></rect>
    </g>

    <g opacity="1">
      <circle cx="262" cy="350" r="18" fill="#E8590C" fill-opacity="0.22"></circle>
      <circle cx="262" cy="350" r="7" fill="#E8590C" stroke="#FFFFFF" stroke-width="2.5"></circle>
      <circle cx="306" cy="330" r="16" fill="#E8590C" fill-opacity="0.22"></circle>
      <circle cx="306" cy="330" r="7" fill="#E8590C" stroke="#FFFFFF" stroke-width="2.5"></circle>
      <circle cx="232" cy="404" r="16" fill="#E8590C" fill-opacity="0.22"></circle>
      <circle cx="232" cy="404" r="7" fill="#E8590C" stroke="#FFFFFF" stroke-width="2.5"></circle>
      <circle cx="352" cy="218" r="7" fill="#E8590C" stroke="#FFFFFF" stroke-width="2.5"></circle>
      <circle cx="70" cy="250" r="7" fill="#E8590C" stroke="#FFFFFF" stroke-width="2.5"></circle>
      <circle cx="200" cy="500" r="7" fill="#E8590C" stroke="#FFFFFF" stroke-width="2.5"></circle>
    </g>

    <circle cx="150" cy="470" r="22" fill="#1971C2" fill-opacity="0.16"></circle>
    <circle cx="150" cy="470" r="8" fill="#1971C2" stroke="#FFFFFF" stroke-width="3"></circle>
  </svg>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(14, 42, 36, 0.45)"></div>

  <section role="dialog" aria-labelledby="filter-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 26px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -8px 24px rgba(18, 32, 28, 0.14)">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #D3DAD6; align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 id="filter-title" style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Filter peta</h1>
      <a href="Peta.dc.html" aria-label="Tutup filter" style="width: 40px; height: 40px; border-radius: 12px; background: #F3F5F2; color: #12201C; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; font-weight: 700; padding: 0; margin-bottom: 8px">Tingkat risiko</legend>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{riskChips}}" as="c" hint-placeholder-count="4">
          <button aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}" style="flex-shrink: 0; white-space: nowrap; height: 36px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.border}}">
            <sc-if value="{{c.hasDot}}" hint-placeholder-val="{{ true }}"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{c.dot}}"></span></sc-if>
            {{c.label}}
          </button>
        </sc-for>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 13px; font-weight: 700; padding: 0; margin-bottom: 8px">Titik api terdeteksi</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #E6EBE8; padding: 4px; border-radius: 14px">
        <sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
          <button aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="height: 36px; border: 0; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: {{p.bg}}; color: {{p.fg}}; box-shadow: {{p.shadow}}">{{p.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; font-weight: 700; padding: 0; margin-bottom: 8px">Kepercayaan satelit</legend>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{confChips}}" as="c" hint-placeholder-count="3">
          <button aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}" style="flex-shrink: 0; white-space: nowrap; height: 36px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.border}}">
            <sc-if value="{{c.hasDot}}" hint-placeholder-val="{{ true }}"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{c.dot}}"></span></sc-if>
            {{c.label}}
          </button>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #EEF1EF">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">{{t.label}}</span>
            <span style="font-size: 12px; color: #5E6E69">{{t.hint}}</span>
          </span>
          <button role="switch" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.toggle}}" style="width: 48px; height: 28px; border-radius: 999px; border: 0; padding: 3px; display: flex; justify-content: {{t.justify}}; background: {{t.bg}}; cursor: pointer; flex-shrink: 0">
            <span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(18, 32, 28, 0.25)"></span>
          </button>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 10px">
      <button onClick="{{reset}}" style="flex: 1 1 0; height: 52px; border-radius: 16px; border: 1px solid #C9D2CD; background: #FFFFFF; color: #12201C; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Reset</button>
      <a href="Peta.dc.html" style="flex: 1 1 0; height: 52px; border-radius: 16px; background: #0E4D3F; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">Terapkan</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.initial();
  }
  initial() {
    return { risk: { Ekstrem: true, Tinggi: true, Sedang: false, Rendah: false }, conf: { Tinggi: true, Nominal: true, Rendah: false }, period: 0, tog: { laporan: true, sensor: false } };
  }
  chip(label, on, dot, toggle) {
    return { label, pressed: on ? 'true' : 'false', bg: on ? '#12201C' : '#FFFFFF', fg: on ? '#FFFFFF' : '#12201C', border: on ? '#12201C' : '#D3DAD6', hasDot: !!dot, dot: dot || 'transparent', toggle };
  }
  renderVals() {
    const s = this.state;
    const dots = { Ekstrem: '#C92A2A', Tinggi: '#E8590C', Sedang: '#E0A800', Rendah: '#2F9E44' };
    const riskChips = Object.keys(s.risk).map((k) => this.chip(k, s.risk[k], dots[k], () => this.setState({ risk: { ...s.risk, [k]: !s.risk[k] } })));
    const confChips = Object.keys(s.conf).map((k) => this.chip(k, s.conf[k], null, () => this.setState({ conf: { ...s.conf, [k]: !s.conf[k] } })));
    const periods = ['24 jam', '3 hari', '7 hari'].map((label, i) => { const on = i === s.period; return { label, pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#12201C' : '#4A5A55', shadow: on ? '0 1px 4px rgba(18,32,28,0.12)' : 'none', pick: () => this.setState({ period: i }) }; });
    const tdefs = [['laporan', 'Laporan warga', 'Tampilkan titik laporan di peta'], ['sensor', 'Stasiun sensor', 'Tampilkan lokasi sensor kelembapan']];
    const toggles = tdefs.map(([k, label, hint]) => { const on = s.tog[k]; return { label, hint, checked: on ? 'true' : 'false', justify: on ? 'flex-end' : 'flex-start', bg: on ? '#0E4D3F' : '#C9D2CD', toggle: () => this.setState({ tog: { ...s.tog, [k]: !on } }) }; });
    return { riskChips, confChips, periods, toggles, reset: () => this.setState(this.initial()) };
  }
}
</script>
</body>
</html>
