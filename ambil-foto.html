<style>
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:#DCE3DF;font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
a{color:#0E4D3F}a:hover{color:#0A372D}
textarea::placeholder,input::placeholder{color:#6B7A75}
[data-radio][aria-pressed="false"] .pw-check{visibility:hidden!important}[data-radio][aria-pressed="true"] .pw-check{visibility:visible!important}
.topbar{width:100%;max-width:430px;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-size:13px;font-weight:600}
.topbar a{text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.phone{width:390px;height:844px;border-radius:40px;overflow:hidden;box-shadow:0 30px 60px rgba(14,42,36,.25),0 0 0 10px #12201C;margin:10px 0 48px}
.phone > div{width:100% !important}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #1971C2;outline-offset:2px}
@media (max-width:440px){
  body{background:#F3F5F2}
  .topbar{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;margin:0}
  .phone > div{height:100% !important}
}
</style>
</head>
